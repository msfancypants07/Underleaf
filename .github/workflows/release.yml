name: Publish Mac download
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Check release version
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - name: Install Godot 4.4.1
        run: |
          curl --fail -L --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_macos.universal.zip -o /tmp/godot.zip
          ditto -x -k /tmp/godot.zip /tmp/godot
          echo "GODOT=/tmp/godot/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
      - name: Import and test
        run: |
          "$GODOT" --headless --path . --editor --quit
          for test in tests/test_ecology.gd tests/test_interface.gd tests/test_mystery.gd tests/test_mystery_interface.gd tests/test_tutorial.gd; do
            "$GODOT" --headless --path . --script "$test"
          done
      - name: Build universal Mac app
        run: |
          python3 tools/build_macos.py
          lipo builds/Underleaf.app/Contents/MacOS/Underleaf -verify_arch arm64 x86_64
          lipo builds/Underleaf.app/Contents/MacOS/Engine -verify_arch arm64 x86_64
          cd builds
          shasum -a 256 Underleaf-macOS.zip > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" builds/Underleaf-macOS.zip builds/SHA256SUMS.txt --verify-tag --latest --title "Underleaf $GITHUB_REF_NAME — Your First Forest" --notes-file RELEASE_NOTES.md
