[preset.0]
name="macOS"
platform="macOS"
runnable=true
export_filter="all_resources"
include_filter="data/*.json"
exclude_filter="builds/*,tests/*,tools/*,GAME_DESIGN.md,README.md"
export_path="builds/Underleaf.app"
[preset.0.options]
application/bundle_identifier="garden.underleaf.game"
application/short_version="0.3.2"
application/version="0.3.2"
codesign/codesign=0

[preset.1]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="data/*.json,assets/fonts/*OFL.txt"
exclude_filter="builds/*,tests/*,tools/*,site/*,docs/*,GAME_DESIGN.md,README.md"
export_path="builds/web/play/index.html"
[preset.1.options]
custom_template/debug="builds/templates/web_nothreads_debug.zip"
custom_template/release="builds/templates/web_nothreads_release.zip"
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false
